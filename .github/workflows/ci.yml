name: CI

on:
  push:
    branches: [main, master, blatt02]
  pull_request:
    branches: [main, master]

jobs:
  build-test-format:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle ausfuehrbar machen
        run: chmod +x gradlew

      - name: Projekt bauen
        run: ./gradlew build

      - name: Tests ausfuehren
        run: ./gradlew test

      - name: Formatierung pruefen
        run: ./gradlew spotlessCheck